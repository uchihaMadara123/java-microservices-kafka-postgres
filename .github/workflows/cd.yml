name: JAVA CD
on:
  push:
    branches:
      - main
jobs:
  build-and-push-docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # ---------------- EUREKA SERVER ----------------

      - name: Build Eureka Server
        working-directory: discovery-server
        run: mvn clean package -DskipTests

      # ---------------- API-GATEWAY ----------------

      - name: Build API Gateway
        working-directory: api-gateway
        run: mvn clean package -DskipTests

      # ---------------- BASE DOMAINS ----------------
      - name: Build Base Domains
        working-directory: base-domains
        run: mvn clean install -DskipTests

      # ---------------- PRODUCT SERVICE ----------------

      - name: Build Product Service
        working-directory: product-service
        run: mvn clean package -DskipTests

      # ---------------- STOCK SERVICE ----------------
      - name: Build stock service
        working-directory: stock-service
        run: mvn clean package -DskipTests

      # ---------------- ORDER SERVICE ----------------

      - name: Build Order Service
        working-directory: order-service
        run: mvn clean package -DskipTests

      # ---------------- EMAIL SERVICE ----------------

      - name: Build Email Service
        working-directory: email-service
        run: mvn clean package -DskipTests



      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Product Service
        uses: docker/build-push-action@v6
        with:
          context: ./product-service
          file: ./product-service/Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/product-service:latest

      - name: Build and Push Stock Service
        uses: docker/build-push-action@v6
        with:
          context: ./stock-service
          file: ./stock-service/Dockerfile
          push: true
          tags:  ${{ secrets.DOCKERHUB_USERNAME }}/stock-service:latest

      - name: Build and Push Order Service
        uses: docker/build-push-action@v6
        with:
          context: ./order-service
          file: ./order-service/Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/order-service:latest

      - name: Build and Push Email Service
        uses: docker/build-push-action@v6
        with:
          context: ./email-service
          file: ./email-service/Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/email-service:latest

      - name: Build and Eureka Server
        uses: docker/build-push-action@v6
        with:
          context: ./discovery-server
          file: ./ediscovery-server/Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/discovery-server:latest

      - name: Build and API Gateway
        uses: docker/build-push-action@v6
        with:
          context: ./api-gateway
          file: ./api-gateway/Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/api-gateway:latest